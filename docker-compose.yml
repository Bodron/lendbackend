services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lend-api
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB:-lend}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-http://localhost:3002}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: lend-admin
    environment:
      BACKEND_API_URL: http://api:3000/api
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped
  site:
    build:
      context: ../site
      dockerfile: Dockerfile
      target: production
    container_name: lend-site
    env_file:
      - path: ../site/.env
        required: false
    environment:
      BACKEND_API_URL: http://api:3000/api
    ports:
      - "3002:3002"
    restart: unless-stopped
